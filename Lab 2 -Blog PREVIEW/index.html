<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Blog preview card</title>
  <style>
    body { background-color: #f4d03f; font-family: sans-serif; }
    /* This makes the card look exactly like the design */
    .card { 
      box-shadow: 8px 8px 0px 0px #000; 
      max-width: 380px; 
      border: 1.5px solid #000 !important;
    }
    .hover-yellow:hover { color: #f4d03f; cursor: pointer; }
  </style>
</head>

<body class="vh-100 d-flex align-items-center justify-content-center">

  <main class="card p-3 bg-white rounded-4">
    <img src="illustration-article.svg" alt="Article Illustration" class="img-fluid rounded-3 mb-3">

    <div class="card-body p-0">
      <span class="badge text-dark fw-bold px-3 py-2 mb-3" style="background-color: #f4d03f;">Learning</span>
      
      <p class="small fw-bold mb-2">Published 21 Dec 2023</p>
      
      <h1 class="h4 fw-bold mb-3 hover-yellow">HTML & CSS foundations</h1>
      
      <p class="text-muted mb-4 small">
        These languages are the backbone of every website, defining structure, content, and presentation.
      </p>

      <div class="d-flex align-items-center gap-2">
        <img src="image-avatar.webp" alt="Greg Hooper" width="32" class="rounded-circle">
        <span class="fw-bold small">Greg Hooper</span>
      </div>
    </div>
  </main>

  <footer class="attribution position-absolute bottom-0 w-100 pb-3">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Blake Morris</a>.
  </footer>

</body>
</html>
